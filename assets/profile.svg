<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1426" />
      <stop offset="50%" stop-color="#122347" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d5524" />
      <stop offset="100%" stop-color="#603813" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2430" />
      <stop offset="100%" stop-color="#0d111a" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1d68f2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1d68f2" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" fill="url(#bgGrad)" />
  <circle cx="200" cy="180" r="160" fill="url(#glow)" />

  <!-- Shoulders & Hoodie -->
  <path d="M70 480 C 70 350, 110 320, 200 320 C 290 320, 330 350, 330 480 Z" fill="url(#hoodieGrad)" />
  <!-- Hoodie details -->
  <path d="M155 320 Q 200 380 245 320 Q 200 420 155 320 Z" fill="#090d15" />
  <path d="M185 360 L 180 430" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  <path d="M215 360 L 220 430" stroke="#475569" stroke-width="3" stroke-linecap="round" />

  <!-- Head & Neck -->
  <path d="M170 270 Q 200 310 230 270 L 230 240 L 170 240 Z" fill="#603813" />
  <!-- Jaw & Face -->
  <ellipse cx="200" cy="190" rx="65" ry="80" fill="url(#skinGrad)" />
  <!-- Hair (Fade Cut) -->
  <path d="M132 170 C 130 110, 160 90, 200 90 C 240 90, 270 110, 268 170 C 260 115, 235 105, 200 105 C 165 105, 140 115, 132 170 Z" fill="#08080a" />
  <!-- Short hair top texture -->
  <ellipse cx="200" cy="115" rx="66" ry="30" fill="#0a0a0d" />

  <!-- Ears -->
  <ellipse cx="134" cy="195" rx="8" ry="16" fill="#734218" />
  <ellipse cx="266" cy="195" rx="8" ry="16" fill="#734218" />

  <!-- Eyebrows -->
  <path d="M152 165 Q 170 158 184 165" stroke="#111" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M216 165 Q 230 158 248 165" stroke="#111" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Eyes -->
  <ellipse cx="168" cy="180" rx="9" ry="5.5" fill="#ffffff" />
  <circle cx="169" cy="180" r="4.5" fill="#1a110a" />
  <circle cx="170.5" cy="178.5" r="1.5" fill="#ffffff" />

  <ellipse cx="232" cy="180" rx="9" ry="5.5" fill="#ffffff" />
  <circle cx="231" cy="180" r="4.5" fill="#1a110a" />
  <circle cx="232.5" cy="178.5" r="1.5" fill="#ffffff" />

  <!-- Nose -->
  <path d="M196 182 Q 192 205 188 214 Q 200 220 212 214 Q 208 205 204 182" fill="#734218" opacity="0.7" />

  <!-- Mouth -->
  <path d="M182 238 Q 200 248 218 238" stroke="#4a250a" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M186 238 Q 200 242 214 238" stroke="#8d5524" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Tech ambient overlay / particles -->
  <circle cx="70" cy="120" r="2" fill="#3b82f6" opacity="0.6" />
  <circle cx="330" cy="220" r="3" fill="#3b82f6" opacity="0.5" />
  <circle cx="310" cy="80" r="2" fill="#60a5fa" opacity="0.8" />
  <circle cx="90" cy="280" r="2.5" fill="#1d68f2" opacity="0.4" />
</svg>
