  <text x="300" y="160" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Digital Agency & Creative Studio Solutions</text>
  
  <rect x="230" y="190" width="140" height="36" rx="6" fill="#1d68f2" />
