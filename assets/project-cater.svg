      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="100%" stop-color="#0e1d38"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#caterBg)" />
  
  <!-- Browser mockup bar -->
  <rect width="600" height="36" fill="#091326" />
